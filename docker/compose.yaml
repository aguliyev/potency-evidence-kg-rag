services:
  db:
    container_name: deffai-db
    image: deffai-db:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.db
    env_file:
      - ../etc/.env
      - ../etc/secrets/.env
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - deffai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    container_name: deffai-migrate
    image: deffai-python:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.notebook
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ../etc/.env
      - ../etc/secrets/.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  notebook:
    container_name: deffai-notebook
    image: deffai-python:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.notebook
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=${JUPYTER_TOKEN:-local-development-token}
    env_file:
      - ../etc/.env
      - ../etc/secrets/.env
    ports:
      - "127.0.0.1:${JUPYTER_HOST_PORT:-8888}:8888"
    volumes:
      - ../lib:/workspace/lib
      - ../notebooks:/workspace/notebooks
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  deffai_postgres_data:
